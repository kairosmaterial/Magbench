type: object
additionalProperties: false
properties:
  model_name: &id001
    type: string
    minLength: 1
  model_key:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  model_version: *id001
  lifecycle:
    enum:
    - pending
    - active
    - reference
  replay_exemption:
    const: packaged_reference_missing_artifacts
  dates:
    type: object
    additionalProperties: false
    properties:
      benchmark_added:
        type: string
        format: date
    required:
    - benchmark_added
  authors:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      properties:
        name: *id001
        affiliation: *id001
        corresponding:
          type: boolean
        email:
          type: string
          format: email
        url: &id002
          type: string
          format: uri
          pattern: ^https://[^\s]+$
      required:
      - name
      - affiliation
      - corresponding
    contains:
      properties:
        corresponding:
          const: true
      required:
      - corresponding
    minContains: 1
    maxContains: 1
  repo:
    anyOf:
    - *id002
    - const: TODO(owner)
  checkpoint:
    type: object
    additionalProperties: false
    properties:
      url:
        anyOf:
        - *id002
        - const: TODO(owner)
      sha256:
        anyOf:
        - &id004
          type: string
          pattern: ^[0-9a-f]{64}$
        - const: TODO(owner)
      size:
        anyOf:
        - &id003
          type: integer
          minimum: 1
        - const: TODO(owner)
    required:
    - url
    - sha256
  license:
    type: object
    additionalProperties: false
    properties:
      code: *id001
      checkpoint: *id001
    required:
    - code
    - checkpoint
  architecture: *id001
  model_params:
    anyOf:
    - *id003
    - const: TODO(owner)
  targets:
    type: array
    minItems: 1
    uniqueItems: true
    items: *id001
  training_sets:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      properties:
        name: *id001
        url:
          anyOf:
          - *id002
          - const: TODO(owner)
        size:
          anyOf:
          - type: integer
            minimum: 0
          - const: TODO(owner)
        open:
          anyOf:
          - type: boolean
          - const: TODO(owner)
      required:
      - name
      - url
      - size
      - open
  test_set_informed:
    anyOf:
    - type: boolean
    - const: TODO(owner)
  evaluation:
    type: object
    additionalProperties: false
    properties:
      moment_initialisation:
        enum:
        - moment_head
        - energy_gradient
      seed_amplitudes:
        enum:
        - uniform_3muB
        - model
      exchange_route:
        enum:
        - energy_mapping
        - exchange_readout
      protocol_version: *id001
      data_version: *id001
      runner_version: *id001
      hardware: *id001
      wall_time_seconds:
        type: number
        minimum: 0
    required:
    - moment_initialisation
    - seed_amplitudes
    - exchange_route
    - protocol_version
    - data_version
    - runner_version
  inference:
    type: object
    additionalProperties: false
    properties:
      script:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_./-]*\.py$
      adapter:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
      command: *id001
      python_version:
        anyOf:
        - type: string
          pattern: ^\d+\.\d+(?:\.\d+)?$
        - const: TODO(owner)
      dependencies:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: ^[A-Za-z0-9_.-]+==[^\s]+$
    required:
    - script
    - adapter
    - command
    - python_version
    - dependencies
  predictions:
    type: object
    additionalProperties: false
    properties:
      url: &id005
        anyOf:
        - *id002
        - const: TODO(owner)
      sha256: &id006
        anyOf:
        - *id004
        - const: TODO(owner)
      size: &id007
        anyOf:
        - *id003
        - const: TODO(owner)
      phonons:
        type: object
        additionalProperties: false
        properties:
          url: *id005
          sha256: *id006
          size: *id007
        required:
        - url
        - sha256
        - size
    required:
    - url
    - sha256
    - size
    - phonons
  metrics:
    type: object
    additionalProperties: false
    properties:
      total:
        type: number
        minimum: 0
        maximum: 1
      ground_state: &id008
        type: number
        minimum: 0
        maximum: 0.2
      hull: *id008
      phonons: *id008
      J: *id008
      magnetovolume: *id008
      ground_state_passes:
        type: integer
        minimum: 0
        maximum: 191
    required:
    - total
    - ground_state
    - hull
    - phonons
    - J
    - magnetovolume
    - ground_state_passes
  paper: *id002
  doi: *id001
  docs: *id002
  pr_url: *id002
  training_cost:
    type: object
    additionalProperties: false
    properties:
      value:
        type: number
        minimum: 0
      unit: *id001
    required:
    - value
    - unit
  notes:
    type: object
    properties:
      disclosure:
        type: string
        minLength: 1
    additionalProperties: true
  publication_status:
    const: awaiting_artifacts
required:
- model_name
- model_key
- model_version
- lifecycle
- dates
- authors
- repo
- checkpoint
- license
- architecture
- model_params
- targets
- training_sets
- test_set_informed
- evaluation
- inference
- predictions
- metrics
$schema: https://json-schema.org/draft/2020-12/schema
title: MagBench model card
allOf:
- if:
    properties:
      lifecycle:
        const: reference
  then:
    properties:
      model_key:
        const: prophet-spin-v1
    required:
    - replay_exemption
  else:
    not:
      required:
      - replay_exemption
- if:
    properties:
      model_key:
        const: prophet-spin-v1
  then:
    properties:
      lifecycle:
        const: reference
- if:
    properties:
      test_set_informed:
        const: true
  then:
    required:
    - notes
    properties:
      notes:
        required:
        - disclosure
- if:
    allOf:
    - properties:
        lifecycle:
          enum:
          - pending
          - active
    - not:
        required:
        - publication_status
  then:
    properties:
      repo: *id002
      checkpoint:
        type: object
        additionalProperties: false
        properties:
          url: *id002
          sha256: *id004
          size: *id003
        required:
        - url
        - sha256
      model_params: *id003
      test_set_informed:
        type: boolean
      predictions:
        type: object
        additionalProperties: false
        properties:
          url: *id002
          sha256: *id004
          size: *id003
          phonons:
            type: object
            additionalProperties: false
            properties:
              url: *id002
              sha256: *id004
              size: *id003
            required:
            - url
            - sha256
            - size
        required:
        - url
        - sha256
        - size
        - phonons
      metrics:
        type: object
        additionalProperties: false
        properties:
          total:
            type: number
            minimum: 0
            maximum: 1
          ground_state:
            type: number
            minimum: 0
            maximum: 0.2
          hull:
            type: number
            minimum: 0
            maximum: 0.2
          phonons:
            type: number
            minimum: 0
            maximum: 0.2
          J:
            type: number
            minimum: 0
            maximum: 0.2
          magnetovolume:
            type: number
            minimum: 0
            maximum: 0.2
          ground_state_passes:
            type: integer
            minimum: 0
            maximum: 191
        required:
        - total
        - ground_state
        - hull
        - phonons
        - J
        - magnetovolume
        - ground_state_passes
- if:
    required:
    - publication_status
  then:
    properties:
      model_key:
        enum:
        - prophet-spin-ex
        - prophet-spin-v2
      lifecycle:
        const: pending
    required:
    - publication_status
