[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "magbench"
version = "0.1.0"
description = "Five-dimensional benchmark for magnetic interatomic potentials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "ase>=3.23", "phonopy>=2.30"]
[project.scripts]
magbench = "magbench.cli:main"
[tool.setuptools.packages.find]
include = ["magbench*"]
