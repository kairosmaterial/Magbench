name: ELEMENTA
dataset_key: elementa
description: A DFT-labelled atomistic dataset covering unary, binary and selected ternary compositions.
  The public release contains nearly 39 million core frames and 4.7 million spin frames with magnetic
  initialisations and DFT-resolved magnetic energy landscapes.
